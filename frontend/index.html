<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Research Opportunity Portal</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Opportunities</a>
        <a class="nav-link" href="create.html">Create</a>
      </div>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="page-header">
      <div>
        <h1>Research Opportunities</h1>
        <p>Browse, update, close, or delete posted research openings.</p>
      </div>
      <a class="btn btn-primary" href="create.html">Create Opportunity</a>
    </div>

    <div id="pageAlert" class="alert alert-box" role="alert"></div>

    <div class="panel">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Area</th>
              <th>Faculty</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="opportunitiesBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">
        No research opportunities found. Create one to get started.
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).get('deleted') === '1') {
      showAlert('pageAlert', 'Opportunity deleted successfully', 'success');
    }
  </script>
</body>
</html>
