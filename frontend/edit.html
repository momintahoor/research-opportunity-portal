<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Research Opportunity</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Research Opportunity Portal</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Opportunities</a>
        <a class="nav-link" href="create.html">Create</a>
      </div>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="page-header">
      <div>
        <h1>Update Opportunity</h1>
        <p>Edit details or change status from Open to Closed.</p>
      </div>
      <a class="btn btn-outline-secondary" href="index.html">Back to List</a>
    </div>

    <div id="pageAlert" class="alert alert-box" role="alert"></div>

    <div class="panel">
      <p class="form-hint">All fields are required. Set status to Closed to close an opportunity.</p>
      <form id="opportunityForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="title">Research Title</label>
            <input class="form-control" type="text" id="title" name="title" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="researchArea">Research Area</label>
            <input class="form-control" type="text" id="researchArea" name="researchArea" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="facultyName">Faculty Name</label>
            <input class="form-control" type="text" id="facultyName" name="facultyName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="department">Department</label>
            <input class="form-control" type="text" id="department" name="department" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="requiredSkills">Required Skills</label>
            <input class="form-control" type="text" id="requiredSkills" name="requiredSkills" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="availablePositions">Available Positions</label>
            <input class="form-control" type="number" id="availablePositions" name="availablePositions" min="1" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="applicationDeadline">Application Deadline</label>
            <input class="form-control" type="date" id="applicationDeadline" name="applicationDeadline" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="status">Status</label>
            <select class="form-select" id="status" name="status" required>
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="mt-4">
          <button class="btn btn-primary" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
